<?xml version="1.0" encoding="UTF-8"?>
<!--
  xISOBurn artwork (source). Two pieces on a transparent 1536x1024 canvas:
    - left:  the app icon (rounded square)       -> crop 38,218 508x528 in make-assets.ps1
    - right: the logo (disc emblem + "xISOBurn") -> crop 560,286 964x392
  Render it to designer.png with xbox-app\tools\render-designer.ps1, then run make-assets.ps1.
  Fonts: Bahnschrift and Arial Black (both ship with Windows).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <!-- glows -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feFlood flood-color="#3ddc2a" flood-opacity="0.85"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#3ddc2a" flood-opacity="0.7"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowFire" x="-40%" y="-60%" width="180%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feFlood flood-color="#ff7a00" flood-opacity="0.8"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="discLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.22"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- disc -->
    <radialGradient id="silver" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e3e6e9"/>
      <stop offset="0.68" stop-color="#a9aeb4"/>
      <stop offset="0.86" stop-color="#d9dcdf"/>
      <stop offset="1" stop-color="#868b91"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#ffd6f5" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#c8f0ff" stop-opacity="0.45"/>
      <stop offset="0.62" stop-color="#e6ffd0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hub" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#e8ebee"/>
      <stop offset="1" stop-color="#8e949a"/>
    </radialGradient>

    <!-- X badge -->
    <radialGradient id="badge" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2d2f2d"/>
      <stop offset="1" stop-color="#050605"/>
    </radialGradient>
    <linearGradient id="xGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4ff7a"/>
      <stop offset="0.5" stop-color="#5be032"/>
      <stop offset="1" stop-color="#1f9e12"/>
    </linearGradient>

    <!-- folder -->
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#c98a00"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.55" stop-color="#ffcc29"/>
      <stop offset="1" stop-color="#f0a800"/>
    </linearGradient>

    <!-- fire -->
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d81e00"/>
      <stop offset="0.55" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ff9a1a"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9800"/>
      <stop offset="0.6" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#fff3a0"/>
    </linearGradient>

    <!-- icon plate -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141614"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9cdd1"/>
    </linearGradient>

    <!-- One flame, base at 0,0, height about 100 (scaled per use). -->
    <path id="flame" d="M0 0 C-30 -4 -40 -36 -22 -62 C-18 -44 -6 -40 -4 -56 C-2 -76 10 -88 6 -104 C30 -84 40 -52 30 -30 C38 -36 40 -46 38 -54 C52 -30 40 -2 0 0 Z"/>
    <path id="flameCore" d="M0 0 C-16 -2 -20 -20 -10 -36 C-8 -26 0 -24 0 -34 C2 -46 8 -52 6 -62 C20 -48 24 -28 16 -14 C22 -18 22 -24 22 -28 C28 -14 20 -1 0 0 Z"/>

    <!-- Disc, centered on 0,0, radius 190. -->
    <g id="disc">
      <circle r="190" fill="url(#silver)" stroke="#6f757b" stroke-width="3"/>
      <path d="M0 0 L-60 -181 A190 190 0 0 1 60 -181 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M0 0 L181 -60 A190 190 0 0 1 181 60 Z" fill="#ffffff" opacity="0.18"/>
      <path d="M0 0 L60 181 A190 190 0 0 1 -60 181 Z" fill="#ffffff" opacity="0.30"/>
      <path d="M0 0 L-181 60 A190 190 0 0 1 -181 -60 Z" fill="#ffffff" opacity="0.15"/>
      <circle r="186" fill="url(#rainbow)"/>
      <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
      <circle r="64" fill="url(#hub)" stroke="#7d838a" stroke-width="3"/>
      <circle r="48" fill="none" stroke="#6b7177" stroke-width="5"/>
      <circle r="36" fill="#b8bdc2"/>
      <circle r="20" fill="#121212" stroke="#555b60" stroke-width="2"/>
      <text x="0" y="-92" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-style="italic"
            font-size="62" fill="#1b1d1f" letter-spacing="-2">DVD</text>
    </g>

    <!-- Stylized X badge, centered on 0,0, radius 80. Curved arms, not the Xbox sphere. -->
    <g id="xbadge">
      <circle r="80" fill="url(#badge)" stroke="#3ddc2a" stroke-width="5" filter="url(#glowSoft)"/>
      <circle r="66" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
      <!-- Four pointed, curved arms (concave sides), like two crossing swooshes. -->
      <path filter="url(#glowGreen)" fill="url(#xGreen)"
            d="M-54 -54 Q-26 -44 0 -16 Q26 -44 54 -54 Q44 -26 16 0 Q44 26 54 54 Q26 44 0 16 Q-26 44 -54 54 Q-44 26 -16 0 Q-44 -26 -54 -54 Z"/>
      <path d="M-46 -46 Q-24 -38 -4 -18" stroke="#f0ffe0" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Yellow folder with fire beneath it. Folder box: x -110..110, y -80..80; fire below to y 160. -->
    <g id="burningFolder">
      <g filter="url(#glowFire)">
        <use xlink:href="#flame" transform="translate(-118 150) scale(0.70 1.05)" fill="url(#flameOuter)"/>
        <use xlink:href="#flame" transform="translate(-74 156) scale(0.85 1.30)" fill="url(#flameOuter)"/>
        <use xlink:href="#flame" transform="translate(-26 160) scale(0.92 1.45)" fill="url(#flameOuter)"/>
        <use xlink:href="#flame" transform="translate(24 160) scale(0.90 1.40)" fill="url(#flameOuter)"/>
        <use xlink:href="#flame" transform="translate(72 156) scale(0.84 1.28)" fill="url(#flameOuter)"/>
        <use xlink:href="#flame" transform="translate(118 150) scale(0.70 1.02)" fill="url(#flameOuter)"/>
        <use xlink:href="#flameCore" transform="translate(-96 152) scale(0.95 1.25)" fill="url(#flameInner)"/>
        <use xlink:href="#flameCore" transform="translate(-48 158) scale(1.05 1.45)" fill="url(#flameInner)"/>
        <use xlink:href="#flameCore" transform="translate(2 160) scale(1.10 1.60)" fill="url(#flameInner)"/>
        <use xlink:href="#flameCore" transform="translate(50 158) scale(1.05 1.42)" fill="url(#flameInner)"/>
        <use xlink:href="#flameCore" transform="translate(98 152) scale(0.92 1.20)" fill="url(#flameInner)"/>
      </g>
      <g filter="url(#shadow)">
        <path d="M-110 -62 Q-110 -80 -92 -80 L-38 -80 Q-28 -80 -22 -70 L-14 -58 L92 -58 Q110 -58 110 -40 L110 62 Q110 80 92 80 L-92 80 Q-110 80 -110 62 Z"
              fill="url(#folderBack)"/>
        <path d="M-100 -46 L100 -46 L100 40 L-100 40 Z" fill="#fff7d6" opacity="0.9"/>
        <path d="M-120 -30 Q-122 -40 -110 -40 L112 -40 Q124 -40 122 -28 L110 64 Q108 80 92 80 L-92 80 Q-108 80 -110 64 Z"
              fill="url(#folderFront)" stroke="#d99a00" stroke-width="2"/>
        <path d="M-108 -32 L112 -32" stroke="#fff4b8" stroke-width="3" stroke-opacity="0.8"/>
      </g>
    </g>

    <!-- The emblem: disc, X badge at the upper right, burning folder at the lower left. -->
    <g id="emblem">
      <g filter="url(#discLight)"><use xlink:href="#disc"/></g>
      <use xlink:href="#xbadge" transform="translate(150 -42)"/>
      <use xlink:href="#burningFolder" transform="translate(-60 50) scale(0.86)"/>
    </g>
  </defs>

  <!-- ===================== App icon (crop 38,218 508x528) ===================== -->
  <g>
    <rect x="62" y="240" width="460" height="482" rx="42" fill="none" stroke="#3ddc2a" stroke-width="4" filter="url(#glowSoft)"/>
    <rect x="62" y="240" width="460" height="482" rx="42" fill="url(#plate)" stroke="#3ddc2a" stroke-width="4"/>
    <use xlink:href="#emblem" transform="translate(278 432) scale(0.86)"/>
    <text x="292" y="676" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-size="76" letter-spacing="1">
      <tspan fill="#45d62c" filter="url(#glowSoft)">x</tspan><tspan fill="url(#white)">ISOBurn</tspan>
    </text>
    <rect x="132" y="696" width="320" height="4" rx="2" fill="#45d62c" filter="url(#glowSoft)"/>
  </g>

  <!-- ===================== Logo (crop 560,286 964x392) ===================== -->
  <g>
    <use xlink:href="#emblem" transform="translate(752 470) scale(0.76)"/>
    <text x="1232" y="530" text-anchor="middle" font-family="Bahnschrift" font-weight="700" font-size="128" letter-spacing="1">
      <tspan fill="#45d62c" filter="url(#glowSoft)">x</tspan><tspan fill="url(#white)">ISOBurn</tspan>
    </text>
    <rect x="965" y="562" width="535" height="5" rx="2.5" fill="#45d62c" filter="url(#glowSoft)"/>
  </g>
</svg>
