# Builds the Xbox app (UWP x64) as a signed .msix package, ready to install through the Xbox Device
# Portal, and the PC receiver as a single .exe. Nothing needs to be installed on your PC: everything
# runs on the GitHub runner, which already ships Visual Studio 2022 (UWP workload) and the Windows SDK.
#
# Signing:
#   - If the SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD secrets exist, that certificate is used
#     (so every version carries the same signature).
#   - Otherwise a new self-signed certificate (CN=xISOBurn) is generated on every build.
#   The certificate Subject MUST match the Publisher in Package.appxmanifest.

name: build

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbox-app:
    name: Xbox app (UWP x64)
    runs-on: windows-2025
    env:
      PROJECT: xbox-app\xISOBurn\xISOBurn.csproj
      MANIFEST: xbox-app\xISOBurn\Package.appxmanifest
      PUBLISHER: CN=xISOBurn
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Package version (0.1.<build number>.0)
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}.0"
          $path = (Resolve-Path $env:MANIFEST).Path
          [xml]$xml = Get-Content $path -Raw
          $xml.Package.Identity.Version = $version
          $xml.Save($path)
          "PKG_VERSION=$version" >> $env:GITHUB_ENV
          "OUT_DIR=$env:GITHUB_WORKSPACE\out" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "xISOBurn.pfx"
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = $env:PFX_PASSWORD
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            Write-Host "Using the certificate from the SIGNING_PFX_BASE64 secret."
          } else {
            $password = [guid]::NewGuid().ToString("N")
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            # EKU 1.3.6.1.5.5.7.3.3 = code signing; 2.5.29.19 = not a CA (required for packages).
            $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER `
              -KeyUsage DigitalSignature -FriendlyName "xISOBurn (test)" `
              -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
            Write-Host "Self-signed certificate generated for this build (no secret configured)."
          }
          if ($cert.Subject -ne $env:PUBLISHER) { throw "Subject '$($cert.Subject)' differs from Publisher '$env:PUBLISHER'" }
          New-Item -ItemType Directory -Force $env:OUT_DIR | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:OUT_DIR\xISOBurn.cer" | Out-Null
          Write-Host "::add-mask::$password"
          "PFX_PATH=$pfx" >> $env:GITHUB_ENV
          "PFX_PASS=$password" >> $env:GITHUB_ENV
          "PFX_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Thumbprint: $($cert.Thumbprint)"

      - name: Restore NuGet packages
        shell: pwsh
        run: msbuild $env:PROJECT -t:Restore -p:Configuration=Release -p:Platform=x64 -v:minimal

      - name: Build and package (Release x64, .NET Native)
        shell: pwsh
        run: |
          # Path without spaces and ending in "\" (required by AppxPackageDir), passed unquoted so the
          # trailing "\" does not escape a quote on the MSBuild command line.
          $pkgDir = "$env:OUT_DIR\package\"
          msbuild $env:PROJECT -m -v:minimal `
            -p:Configuration=Release -p:Platform=x64 `
            -p:AppxBundle=Never -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir=$pkgDir `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile=$env:PFX_PATH `
            -p:PackageCertificatePassword=$env:PFX_PASS `
            -p:PackageCertificateThumbprint=$env:PFX_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check output
        shell: pwsh
        run: |
          $files = Get-ChildItem $env:OUT_DIR -Recurse -File
          $files | ForEach-Object { Write-Host ("{0,10:N0}  {1}" -f $_.Length, $_.FullName.Substring($env:OUT_DIR.Length + 1)) }
          $msix = $files | Where-Object { $_.Extension -in ".msix", ".appx" -and $_.Name -like "xISOBurn*" }
          if (-not $msix) { throw "App package not found in $env:OUT_DIR" }
          $sig = Get-AuthenticodeSignature $msix[0].FullName
          Write-Host "Signature: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          "## xISOBurn $env:PKG_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "Download the **xISOBurn-xbox-$env:PKG_VERSION** artifact and follow docs/install.md." >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $files | ForEach-Object { $_.FullName.Substring($env:OUT_DIR.Length + 1) } >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: xISOBurn-xbox-${{ env.PKG_VERSION }}
          path: out/
          if-no-files-found: error

  # PC receiver: run its tests, then package it as a single .exe (PyInstaller) so nothing has to be
  # installed on the PC. The script itself only uses the Python standard library.
  pc-receiver:
    name: PC receiver (Windows .exe)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tests
        shell: pwsh
        working-directory: pc-receiver
        run: python -m unittest -v test_receiver

      - name: Build xisoburn-receiver.exe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --onefile --console --name xisoburn-receiver --distpath out --workpath build pc-receiver/xisoburn_receiver.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item pc-receiver/xisoburn_receiver.py out/
          Copy-Item pc-receiver/README.md out/
          & out/xisoburn-receiver.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: xisoburn-receiver-${{ github.run_number }}
          path: out/
          if-no-files-found: error
