# Compila o app do Xbox (UWP x64) e gera um pacote .msix assinado, pronto para instalar pelo
# Device Portal do Xbox. Nada precisa estar instalado no seu PC: tudo roda no runner do GitHub,
# que já vem com o Visual Studio 2022 (carga UWP) e o Windows SDK 10.0.26100.
#
# Assinatura:
#   - Se os secrets SIGNING_PFX_BASE64 e SIGNING_PFX_PASSWORD existirem, usa esse certificado
#     (assim todas as versões saem com a mesma assinatura).
#   - Senão, gera um certificado autoassinado novo (CN=xISOBurn) a cada build.
#   O Subject do certificado TEM que ser igual ao Publisher do Package.appxmanifest.

name: build

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xbox-app:
    name: App Xbox (UWP x64)
    runs-on: windows-2025
    env:
      PROJECT: xbox-app\xISOBurn\xISOBurn.csproj
      MANIFEST: xbox-app\xISOBurn\Package.appxmanifest
      PUBLISHER: CN=xISOBurn
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Versão do pacote (0.1.<número do build>.0)
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}.0"
          $path = (Resolve-Path $env:MANIFEST).Path
          [xml]$xml = Get-Content $path -Raw
          $xml.Package.Identity.Version = $version
          $xml.Save($path)
          "PKG_VERSION=$version" >> $env:GITHUB_ENV
          "OUT_DIR=$env:GITHUB_WORKSPACE\out" >> $env:GITHUB_ENV
          Write-Host "Versão: $version"

      - name: Certificado de assinatura
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "xISOBurn.pfx"
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = $env:PFX_PASSWORD
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            Write-Host "Usando o certificado do secret SIGNING_PFX_BASE64."
          } else {
            $password = [guid]::NewGuid().ToString("N")
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            # EKU 1.3.6.1.5.5.7.3.3 = assinatura de código; 2.5.29.19 = sem CA (exigido para pacotes).
            $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER `
              -KeyUsage DigitalSignature -FriendlyName "xISOBurn (teste)" `
              -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
            Write-Host "Certificado autoassinado gerado neste build (sem secret configurado)."
          }
          if ($cert.Subject -ne $env:PUBLISHER) { throw "Subject '$($cert.Subject)' diferente do Publisher '$env:PUBLISHER'" }
          New-Item -ItemType Directory -Force $env:OUT_DIR | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:OUT_DIR\xISOBurn.cer" | Out-Null
          Write-Host "::add-mask::$password"
          "PFX_PATH=$pfx" >> $env:GITHUB_ENV
          "PFX_PASS=$password" >> $env:GITHUB_ENV
          "PFX_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Thumbprint: $($cert.Thumbprint)"

      - name: Restaurar pacotes NuGet
        shell: pwsh
        run: msbuild $env:PROJECT -t:Restore -p:Configuration=Release -p:Platform=x64 -v:minimal

      - name: Compilar e empacotar (Release x64, .NET Native)
        shell: pwsh
        run: |
          # Caminho sem espaços e terminado em "\" (exigido por AppxPackageDir), passado sem aspas
          # para o "\" final não escapar uma aspa na linha de comando do MSBuild.
          $pkgDir = "$env:OUT_DIR\pacote\"
          msbuild $env:PROJECT -m -v:minimal `
            -p:Configuration=Release -p:Platform=x64 `
            -p:AppxBundle=Never -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir=$pkgDir `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile=$env:PFX_PATH `
            -p:PackageCertificatePassword=$env:PFX_PASS `
            -p:PackageCertificateThumbprint=$env:PFX_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Conferir saída
        shell: pwsh
        run: |
          $files = Get-ChildItem $env:OUT_DIR -Recurse -File
          $files | ForEach-Object { Write-Host ("{0,10:N0}  {1}" -f $_.Length, $_.FullName.Substring($env:OUT_DIR.Length + 1)) }
          $msix = $files | Where-Object { $_.Extension -in ".msix", ".appx" -and $_.Name -like "xISOBurn*" }
          if (-not $msix) { throw "Pacote do app não encontrado em $env:OUT_DIR" }
          $sig = Get-AuthenticodeSignature $msix[0].FullName
          Write-Host "Assinatura: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          "## xISOBurn $env:PKG_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "Baixe o artefato **xISOBurn-xbox-$env:PKG_VERSION** e siga docs/spike.md (seção Instalação)." >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $files | ForEach-Object { $_.FullName.Substring($env:OUT_DIR.Length + 1) } >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: xISOBurn-xbox-${{ env.PKG_VERSION }}
          path: out/
          if-no-files-found: error
