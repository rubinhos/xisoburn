# Screenshots of the web page for the README: runs the Xbox app's web server on example copies
# (tools/web-screenshots) and photographs the pages with headless Microsoft Edge. Started by hand, or
# by a pull request that changes the harness or this file. The images come out as an artifact; copy
# them to docs/images/.

name: web-screenshots

on:
  pull_request:
    paths: ["tools/web-screenshots/**", ".github/workflows/web-screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-screenshots:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the harness
        shell: pwsh
        run: |
          dotnet build tools/web-screenshots/WebScreenshots.csproj -c Release -o harness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Serve the example page and take the screenshots
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "harness\WebScreenshots.exe" -ArgumentList "8770", "600" -PassThru `
               -RedirectStandardOutput harness.out -RedirectStandardError harness.err
          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) { Get-Content harness.out, harness.err; throw "the harness exited" }
            try { $r = Invoke-WebRequest "http://127.0.0.1:8770/" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { break } } catch { }
            Start-Sleep -Seconds 3
          }
          Get-Content harness.out

          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($url, $file, $height) {
            $out = Join-Path (Resolve-Path shots) $file
            & $edge --headless=new --disable-gpu --hide-scrollbars --force-dark-mode "--window-size=1100,$height" `
                    "--screenshot=$out" $url | Out-Null
            Start-Sleep -Seconds 2
            if (-not (Test-Path $out)) { throw "no screenshot for $url" }
          }
          Shot "http://127.0.0.1:8770/" "web-main.png" 1600
          Shot "http://127.0.0.1:8770/settings" "web-settings.png" 1600

          # Crop the empty background below the page.
          Add-Type -AssemblyName System.Drawing
          foreach ($f in Get-ChildItem shots -Filter *.png) {
            $img = [System.Drawing.Bitmap]::FromFile($f.FullName)
            $bg = $img.GetPixel(2, $img.Height - 2)
            $bottom = $img.Height - 1
            :rows while ($bottom -gt 50) {
              for ($x = 0; $x -lt $img.Width; $x += 4) {
                if ($img.GetPixel($x, $bottom).ToArgb() -ne $bg.ToArgb()) { break rows }
              }
              $bottom--
            }
            $h = [Math]::Min($img.Height, $bottom + 24)
            $crop = $img.Clone((New-Object System.Drawing.Rectangle 0, 0, $img.Width, $h), $img.PixelFormat)
            $img.Dispose()
            $crop.Save($f.FullName, [System.Drawing.Imaging.ImageFormat]::Png)
            $crop.Dispose()
            "{0}: {1} x {2}" -f $f.Name, (1100), $h
          }

      - uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: shots/
          if-no-files-found: error
